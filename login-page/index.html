<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aster Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <div class="bg-orb orb-a" aria-hidden="true"></div>
    <div class="bg-orb orb-b" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <main class="layout">
        <section class="brand-panel">
            <p class="eyebrow">Aster Workspace</p>
            <h1>Welcome back, creator.</h1>
            <p class="subtitle">
                Your funnel, campaigns, and customer moments are waiting for you.
            </p>
        </section>

        <section class="card-wrap">
            <form class="login-card" id="loginForm" novalidate>
                <h2>Sign in</h2>
                <p class="helper">Use your email and password to continue.</p>

                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com"
                    required />

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password"
                    placeholder="Enter your password" minlength="8" required />

                <div class="row">
                    <label class="checkbox">
                        <input type="checkbox" name="remember" />
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="text-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary">Sign in</button>
                <p id="status" class="status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="./script.js"></script>
</body>

</html>
